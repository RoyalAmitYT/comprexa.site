<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var theme = null;
          var raw = localStorage.getItem("comprexa_settings_v1");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && (parsed.theme === "dark" || parsed.theme === "light")) {
              theme = parsed.theme;
            }
          }
          if (!theme) {
            var legacy = localStorage.getItem("comprexa-theme");
            if (legacy === "dark" || legacy === "light") {
              theme = legacy;
            }
          }
          if (!theme) {
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
              theme = "dark";
            } else {
              theme = "light";
            }
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch(e) {}
      })();
    </script>
